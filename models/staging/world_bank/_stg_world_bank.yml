version: 2

models:
  - name: stg_world_bank__indicators
    description: Cleaned and typed World Bank indicator record
    columns:
      - name: country_id
        tests:
          - not_null
      - name: indicator_id
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: indicator_value
        tests:
          - not_null